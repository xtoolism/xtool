name: Deploy site

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@master
        with:
          fetch-depth: 0 # Fetch all history for git info
      - uses: actions/setup-node@master
        with:
          node-version: 22
      - name: Install Dependencies
        run: npm ci
      - name: Build Quartz
        run: npx quartz build
      - name: Copy build to Nginx directory
        run: |
          mkdir -p /mnt/openresty/www/sites/xtool
          rm -rf /mnt/openresty/www/sites/xtool/*
          cp -r public/* /mnt/openresty/www/sites/xtool/
